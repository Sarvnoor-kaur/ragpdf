# Required metadata
sonar.projectKey=ragpdf-mono
sonar.projectName=RAGPDF

# Comma-separated paths to directories containing main source files.
sonar.sources=company-policy-ai/frontend/src,company-policy-ai/backend

# Exclude directories and files from being analyzed.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.env*,**/coverage/**,**/*.pdf,**/*.log,**/*.tmp,**/package-lock.json,**/__tests__/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Test files configuration
sonar.tests=company-policy-ai/frontend/src,company-policy-ai/backend
sonar.test.inclusions=**/__tests__/**/*.test.js,**/__tests__/**/*.test.jsx,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Coverage report paths
sonar.javascript.lcov.reportPaths=company-policy-ai/backend/coverage/lcov.info,company-policy-ai/frontend/coverage/lcov.info

# Coverage exclusions - don't count test files toward coverage
sonar.coverage.exclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/vitest.config.js,**/jest.config.js

# Language-specific settings
sonar.sourceEncoding=UTF-8

# Quality Gate thresholds
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
