# Required metadata
sonar.projectKey=ragpdf-mono
sonar.projectName=RAGPDF

# Comma-separated paths to directories containing main source files.
# By explicitly setting this, we avoid scanning terraform, k8s, or root scripts.
sonar.sources=company-policy-ai/frontend/src,company-policy-ai/backend

# Exclude directories and files from being analyzed.
# This ensures secrets, dependencies, and binary files are ignored.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.env*,**/coverage/**,**/*.pdf,**/*.log,**/*.tmp,**/package-lock.json

# Encoding of the source code. Default is default system encoding.
sonar.sourceEncoding=UTF-8

# (Optional) If you have test files inside your source directories, 
# you can prevent them from being analyzed as production code by uncommenting and adjusting these:
# sonar.tests=company-policy-ai/frontend/src,company-policy-ai/backend
# sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.test.jsx,**/*.spec.jsx
