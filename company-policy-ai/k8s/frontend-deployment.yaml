apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragpdf-frontend
  namespace: ragpdf
  labels:
    app: ragpdf-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragpdf-frontend
  template:
    metadata:
      labels:
        app: ragpdf-frontend
    spec:
      containers:
      - name: frontend
        image: sarvnoorkaur/ragpdf-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
