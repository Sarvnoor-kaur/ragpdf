apiVersion: v1
kind: Secret
metadata:
  name: ragpdf-secrets
  namespace: ragpdf
type: Opaque
stringData:
  # ⚠️ WARNING: DO NOT COMMIT REAL SECRETS TO GITHUB! ⚠️
  # Replace the following placeholders with actual values BEFORE applying, 
  # OR use the kubectl create secret command provided in the instructions.
  MONGODB_URI: "REPLACE_ME_MONGODB_URI"
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
  GEMINI_API_KEY: "REPLACE_ME_GEMINI_API_KEY"
